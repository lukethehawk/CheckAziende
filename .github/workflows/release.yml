name: Release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify stable build
        run: |
          npm run syntax
          npm test

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and validate store packages
        run: npm run validate:stores

      - name: Create store ZIP files
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          for TARGET in firefox chrome edge opera; do
            (
              cd "dist/$TARGET"
              zip -r "../../release/CheckAziende-${VERSION}-${TARGET}.zip" .
            )
          done

      - name: Upload store packages
        uses: actions/upload-artifact@v4
        with:
          name: CheckAziende-${{ steps.version.outputs.version }}-stores
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
